[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orca-s04-starter"
version = "0.2.0"
description = "S04 continuous-audio detection baseline and reproducible acoustic research starter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24,<3", "pandas>=2,<3", "scipy>=1.11,<2",
  "matplotlib>=3.7,<4", "soundfile>=0.12,<1",
  "scikit-learn==1.8.0", "joblib>=1.3,<2", "threadpoolctl>=3,<4"
]

[project.scripts]
orca-s04 = "orca_s04.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
